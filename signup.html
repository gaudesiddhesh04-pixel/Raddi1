<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>RADDI Signup</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#2e7d32,#66bb6a);
}

.container{
background:white;
padding:40px;
width:360px;
border-radius:12px;
box-shadow:0 10px 30px rgba(0,0,0,0.2);
text-align:center;
}

.container h2{
margin-bottom:20px;
color:#2e7d32;
}

.input-group{
margin-bottom:15px;
text-align:left;
}

.input-group label{
font-size:14px;
}

.input-group input{
width:100%;
padding:10px;
margin-top:5px;
border:1px solid #ccc;
border-radius:6px;
}

button{
width:100%;
padding:12px;
background:#2e7d32;
color:white;
border:none;
border-radius:6px;
font-size:15px;
cursor:pointer;
}

button:hover{
background:#1b5e20;
}

.link{
margin-top:15px;
font-size:14px;
}

.link a{
color:#2e7d32;
text-decoration:none;
font-weight:500;
}

.logo{
font-size:22px;
font-weight:600;
color:#2e7d32;
margin-bottom:20px;
}

</style>
</head>

<body>

<div class="container">

<div class="logo">RADDI</div>

<h2>Create Account</h2>

<form id="signupForm">

<div class="input-group">
<label>Name</label>
<input type="text" name="name" required>
</div>

<div class="input-group">
<label>Email</label>
<input type="email" name="email" required>
</div>

<div class="input-group">
<label>Password</label>
<input type="password" name="password" required>
</div>

<button type="submit">Sign Up</button>

<div class="link">
Already have an account? <a href="login.html">Login</a>
</div>

</form>

</div>

<script>
document.getElementById("signupForm").addEventListener("submit", function(e){
 e.preventDefault();
 alert("Sign up is available only in the full PHP/MySQL version. This GitHub Pages version is a static demonstration.");
});
</script>
</body>
</html>
